<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction H — Game hangar</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Night maintenance bay painted on canvas; UI is gunmetal plates with fat bevelled rims, slanted, one amber accent. */
:root{
  --ink:#04070b; --face:#141b24; --face2:#0c1118; --rim:#2c3a4c; --rimhi:#5b6f88; --text:#e4ecf5; --mute:#8594a8;
  --amber:#ffae2b; --amber2:#e07a00; --cyan:#5fd4ff; --green:#4bd88a;
  --f-head:'Oxanium','Rajdhani',sans-serif; --f-label:'Rajdhani','Barlow',sans-serif; --f-num:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020305;overflow:hidden}
.stage{position:absolute;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#06090e;color:var(--text);font-family:var(--f-label)}
canvas{position:absolute;left:0;top:0;width:1600px;height:900px}
#bg{z-index:0} #fx{z-index:7;pointer-events:none;mix-blend-mode:screen}
.lbl{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.16em}
.head{font-family:var(--f-head);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.mask{display:inline-block;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}

/* ---- block: item-style geometry. Fat dark outline, chamfered corners, clean light-to-dark face, bright top edge, dark lip ---- */
.plate{position:absolute;z-index:8;--c:18px;padding:4px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.plate::before{content:"";position:absolute;inset:0;z-index:0;
  background:#05080c;
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.plate>.in{position:relative;z-index:1;height:100%;--k:calc(var(--c) - 3px);
  clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k));
  background:linear-gradient(180deg,#2b3441,#232b36)}
.plate>.in::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(200,215,235,.14);pointer-events:none}

.notch{position:absolute;top:0;left:30px;width:58px;height:4px;background:var(--amber);z-index:2}

/* ---- HUD ---- */
.lv{left:34px;top:24px;width:430px;height:70px;--c:16px}
.lv .in{display:flex;align-items:center;gap:16px;padding:0 22px 0 18px}
.lv .n{display:flex;flex-direction:column;line-height:.9}
.lv .n small{font-size:12px;color:var(--mute)}
.lv .n b{font-family:var(--f-head);font-size:38px;font-weight:800;color:var(--amber);font-weight:700}
.xp{flex:1}
.xp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:5px}
.xp .row .num{color:var(--text);font-size:13px}
.seg{height:12px;background:#05080c;border:2px solid #1f2a38;position:relative;overflow:hidden}
.seg i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
.seg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(0,0,0,.65) 7px 9px)}
.chip{top:28px;width:236px;height:62px;--c:14px}
.chip .in{display:flex;align-items:center;gap:12px;padding-left:16px}
.chip svg{width:34px;height:34px;flex:none}
.chip b{flex:1;font-size:26px}
.chip .add{position:relative}
.chip .add::before,.chip .add::after{content:"";position:absolute;left:50%;top:50%;background:#2a1400;transform:translate(-50%,-50%)}
.chip .add::before{width:18px;height:5px}
.chip .add::after{width:5px;height:18px}
.chip .add{align-self:stretch;width:54px;background:var(--amber);border-left:4px solid var(--ink);clip-path:polygon(0 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%)}
.gear{left:1500px;top:28px;width:66px;height:62px;--c:14px}
.gear .in{display:flex;align-items:center;justify-content:center;color:#cbd6e4}
.gear .mask{width:30px;height:30px}
.dot{position:absolute;z-index:3;width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--ink),0 0 10px var(--amber)}



/* ---- G: function-specific parts ---- */
.readout{position:absolute;top:30px;height:56px;display:flex;align-items:center;gap:12px;padding:0 6px 0 14px;z-index:8;
  background:rgba(4,7,11,.72);box-shadow:inset 0 0 0 3px #05080c,inset 0 0 0 5px #1f2733}
.readout svg{width:32px;height:32px}
.readout b{font:800 30px var(--f-head);letter-spacing:.04em;min-width:112px;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.readout b.gold{background-image:linear-gradient(180deg,#ffe8a0,#f2b233 55%,#c98410)}
.readout b.tok{background-image:linear-gradient(180deg,#ff9a8c,#e2382a 55%,#a81a10)}
.readout .plus{width:40px;height:40px;background:#39c45f;position:relative;box-shadow:inset 0 0 0 3px #05080c}
.readout .plus::before,.readout .plus::after{content:"";position:absolute;left:50%;top:50%;background:#05180b;transform:translate(-50%,-50%)}
.readout .plus::before{width:18px;height:5px}.readout .plus::after{width:5px;height:18px}
.rack{position:absolute;left:34px;top:752px;width:1112px;height:124px;z-index:8;padding:5px;background:#05080c;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);display:flex;gap:5px}
.slot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#1c4fb4;color:#fff;position:relative}
.slot:nth-child(odd){background:#1a48a5}
.slot::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(170,205,255,.45)}
.slot .mask{width:52px;height:52px;background:#fff}
.slot span{font:700 19px var(--f-label);letter-spacing:.12em;text-transform:uppercase}
.slot .pip{position:absolute;right:8px;top:8px;min-width:22px;height:22px;padding:0 5px;background:#ff8a1a;color:#1d0e00;font:800 13px var(--f-num);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #05080c}
.deploy{position:absolute;left:1180px;top:752px;width:386px;height:124px;z-index:8;padding:5px;background:#05080c;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.deploy .face{height:100%;display:flex;align-items:center;gap:18px;padding:0 24px 0 0;background:#3cc463;position:relative;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.deploy .face::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:rgba(220,255,225,.55)}
.deploy .haz{width:40px;align-self:stretch;background:repeating-linear-gradient(-45deg,#f2c21b 0 12px,#05080c 12px 24px);border-right:5px solid #05080c}
.deploy h3{font:800 54px var(--f-head);letter-spacing:.02em;color:#062010;line-height:1}
.deploy small{display:block;font:600 17px var(--f-label);color:#0b3a1a;margin-top:2px}
.deploy .go2{margin-left:auto;width:62px;height:62px;background:#05080c;display:flex;align-items:center;justify-content:center}
.deploy .go2::before{content:"";border-left:22px solid #3cc463;border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
.tasksBtn .gi{width:32px;height:32px;background:#e8eef6;-webkit-mask:url(assets/icons/interface_achievements.png) center/contain no-repeat;mask:url(assets/icons/interface_achievements.png) center/contain no-repeat}

/* ---- tasks: button + checklist drawer ---- */
.tasksBtn{left:34px;top:124px;width:236px;height:66px;cursor:pointer;z-index:11}
.tasksBtn .in{display:flex;align-items:center;gap:14px;padding:0 16px}
.tasksBtn .ico{width:30px;height:30px;position:relative;flex:none}
.tasksBtn .ico i{position:absolute;left:11px;width:19px;height:6px;background:#cbd6e4}
.tasksBtn .ico b{position:absolute;left:0;width:7px;height:7px;background:#5b6a80}
.tasksBtn .ico b:first-of-type{background:var(--green)}
.tasksBtn .ico :nth-child(1),.tasksBtn .ico :nth-child(2){top:1px}.tasksBtn .ico :nth-child(3),.tasksBtn .ico :nth-child(4){top:12px}.tasksBtn .ico :nth-child(5),.tasksBtn .ico :nth-child(6){top:23px}
.tasksBtn .t{font:800 24px var(--f-head);letter-spacing:.06em;flex:1}
.tasksBtn .cnt{min-width:34px;height:30px;padding:0 8px;background:var(--amber);color:#1d0e00;font:800 18px var(--f-num);display:flex;align-items:center;justify-content:center;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.tasksBtn.open .in{background:linear-gradient(180deg,#3a4556,#2e3746)}
.veil{position:absolute;inset:0;z-index:9;background:rgba(3,5,8,.55);display:none}
.drawer{left:34px;top:204px;width:470px;height:auto;display:none;z-index:10}
.drawer>.in{height:auto}
.stage.tasks-open .veil,.stage.tasks-open .drawer{display:block}
.drawer .in{padding:18px 22px 16px 24px}
.dh{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:3px solid var(--ink);margin-bottom:4px}
.dh .head{font-size:24px;font-weight:800}
.dh .lbl{font-size:11px;color:var(--mute)}
.x{width:34px;height:34px;background:#141a22;position:relative;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);cursor:pointer}
.x::before,.x::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:4px;background:#cbd6e4;transform:translate(-50%,-50%) rotate(45deg)}
.x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:4px 14px;align-items:center;padding:12px 0;border-bottom:2px solid #1b2330}
.task:last-child{border-bottom:0}
.box{width:30px;height:30px;grid-row:span 2;background:#0b0f15;box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 5px #3a4a60;position:relative;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.task.done .box{background:var(--green);box-shadow:inset 0 0 0 3px var(--ink)}
.task.done .box::after{content:"";position:absolute;left:9px;top:5px;width:8px;height:14px;border:solid var(--ink);border-width:0 4px 4px 0;transform:rotate(45deg)}
.task .t{font-size:18px;font-weight:600;letter-spacing:.02em}
.task.done .t{color:var(--mute)}
.task .v{font-size:13px;color:var(--mute)}
.task .seg{grid-column:2 / 3;height:8px;border-width:1px}
.task .seg::after{background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(0,0,0,.6) 5px 7px)}
.task.done .seg i{background:var(--green)}
.claimBtn{grid-row:span 2;align-self:center;height:36px;padding:0 16px;background:var(--green);color:#04170b;font:800 15px var(--f-head);letter-spacing:.08em;display:flex;align-items:center;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.rew{grid-row:span 2;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.rew svg{width:18px;height:18px}

/* ---- side panels ---- */
.ops{left:34px;top:124px;width:410px;height:252px}
.ops .in,.unit .in{padding:14px 20px 14px 22px}
.ph{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #223040;padding-bottom:8px;margin-bottom:6px}
.ph .head{font-size:22px;font-weight:800}
.ph .lbl{font-size:11px;color:var(--mute)}
.q{display:grid;grid-template-columns:26px 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid #1b2633}
.q:last-child{border-bottom:0}
.q .st{width:20px;height:20px;border:2px solid #3a4a60;grid-row:span 2;transform:rotate(45deg)}
.q .st.done{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(75,216,138,.6)}
.q .t{font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--text)}
.q .v{font-size:13px;color:var(--mute)}
.q .seg{grid-column:2 / 4;height:8px;border-width:1px}
.q .seg::after{background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(0,0,0,.6) 5px 7px)}
.q.claim .v{color:var(--green)}
.q.claim .seg i{background:var(--green)}

.unit{left:1236px;top:118px;width:330px;height:auto}
.unit>.in{height:auto;padding:14px!important}
.unit .team{margin:0;gap:12px}
.unit .code{font-size:11px;color:var(--amber)}
.unit h2{font-family:var(--f-head);font-size:40px;line-height:1;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.unit .sub{font-size:14px;color:var(--mute);font-weight:600;margin:2px 0 10px;letter-spacing:.03em}
.sr{display:grid;grid-template-columns:22px 92px 1fr 78px;gap:10px;align-items:center;height:34px;border-top:1px solid #1b2633}
.sr .mask{width:18px;height:18px;color:var(--mute)}
.sr .lbl{font-size:12px;color:var(--mute)}
.sr .seg{height:8px;border-width:1px}
.sr .seg::after{background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(0,0,0,.6) 5px 7px)}
.sr b{text-align:right;font-size:17px}
.sr.warn b{color:var(--amber)}
.sr.warn .seg i{background:var(--amber)}
.team{display:flex;gap:12px;margin-top:14px}
.tb{flex:1;height:54px;position:relative;padding:4px;cursor:pointer}
.tb::before{content:"";position:absolute;inset:0;background:var(--ink);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.tb .in{position:relative;height:100%;display:flex;align-items:center;justify-content:center;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);background:linear-gradient(180deg,#323c4b,#262e3a);font:800 22px var(--f-head);letter-spacing:.08em;color:var(--text)}
.tb .in::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(200,215,235,.14)}
.tb.on .in{background:var(--amber);color:#1d0e00}
.tb.on .in::before{background:rgba(255,240,200,.5)}
.tm{flex:1;height:60px;position:relative;overflow:hidden;background:#141a22;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:inset 0 0 0 3px #05080c,inset 0 0 0 5px #2c3a4c}
.tm.on{box-shadow:inset 0 0 0 3px #05080c,inset 0 0 0 5px var(--amber)}
.tm .w{position:absolute;left:50%;top:6px;transform:translateX(-50%)}
.tm span{position:absolute;left:8px;top:2px;font:700 13px var(--f-num);color:var(--mute);transform:none;z-index:2}
.tm.on span{color:var(--amber)}

/* ---- mech ---- */
#mech{position:absolute;z-index:5;filter:brightness(.84) contrast(1.06) saturate(.85) drop-shadow(2px 0 0 #05080c) drop-shadow(-2px 0 0 #05080c) drop-shadow(0 2px 0 #05080c) drop-shadow(0 -2px 0 #05080c) drop-shadow(0 -2px 0 rgba(255,214,160,.35)) drop-shadow(0 16px 14px rgba(0,0,0,.55))}
#shade{position:absolute;z-index:6;pointer-events:none;mix-blend-mode:multiply;opacity:.42}
#refl{position:absolute;z-index:3;transform:scaleY(-1);opacity:.2;filter:blur(1.5px) saturate(.7);-webkit-mask:linear-gradient(0deg,#000,transparent 55%);mask:linear-gradient(0deg,#000,transparent 55%)}
#ped{position:absolute;left:0;top:0;z-index:4;pointer-events:none}
#pedSide{position:absolute;left:0;top:0;z-index:1;pointer-events:none;filter:brightness(.72) saturate(.8)}
#side1,#side2{position:absolute;z-index:2;filter:brightness(.5) saturate(.7) drop-shadow(2px 0 0 #05080c) drop-shadow(-2px 0 0 #05080c) drop-shadow(0 2px 0 #05080c) drop-shadow(0 -2px 0 #05080c)}

/* ---- dock ---- */
.nb{top:778px;width:118px;height:96px;--c:14px}
.nb .in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#d4deea}
.nb .mask{width:40px;height:40px}
.nb .lbl{font-size:13px;color:var(--text);letter-spacing:.12em}
.nb .dot{top:-7px;right:10px}
.go{left:1188px;top:762px;width:378px;height:112px;--c:24px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(255,160,40,.22))}
.go>.in{background:linear-gradient(180deg,#ffb43a,#f5a020)}
.go>.in::before{background:rgba(255,240,200,.5)}
.go .in{display:flex;align-items:center;padding:0 26px 0 30px;color:#1d0e00;gap:18px}
.go .zone{font-size:12px;letter-spacing:.2em;opacity:.8}
.go h3{font-family:var(--f-head);font-size:42px;line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.go .arr{margin-left:auto;width:58px;height:58px;background:#10151c;color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:26px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}

.foot{position:absolute;left:38px;top:754px;font-size:11px;color:var(--mute);z-index:9;letter-spacing:.24em}

/* ---- G: metal finish. Brushed grain, one soft reflection band, bevel light/dark, corner rivets ---- */
:root{--brush:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.05) 1px 2px,transparent 2px 3px);
  --sheen:linear-gradient(112deg,transparent 0 38%,rgba(255,255,255,.07) 44%,rgba(255,255,255,.02) 52%,transparent 58%);
  --rivet:radial-gradient(circle at 40% 35%,#9aa9bd 0 1.5px,#4a5668 2px,#0a0e13 3.5px,transparent 4px)}
.plate>.in{background:var(--sheen),var(--brush),linear-gradient(180deg,#3b4658 0%,#2c3543 42%,#252d39 58%,#2d3644 100%)!important;
  box-shadow:inset 0 2px 0 rgba(215,228,245,.22),inset 0 -3px 0 rgba(0,0,0,.45),inset 2px 0 0 rgba(215,228,245,.06),inset -2px 0 0 rgba(0,0,0,.3)}
.plate>.in::before{display:none}
.plate>.in::after{content:"";position:absolute;inset:0;pointer-events:none;display:block;height:auto;
  background:var(--rivet) 10px calc(100% - 10px)/8px 8px no-repeat,var(--rivet) calc(100% - 10px) 10px/8px 8px no-repeat}
.tb .in{background:var(--sheen),var(--brush),linear-gradient(180deg,#3d485a,#2a323f 55%,#303a48)!important;box-shadow:inset 0 2px 0 rgba(215,228,245,.2),inset 0 -2px 0 rgba(0,0,0,.45)}
.tb.on .in{background:var(--sheen),var(--brush),linear-gradient(180deg,#ffd06a,#f5a020 50%,#e08a10)!important;box-shadow:inset 0 2px 0 rgba(255,245,210,.6),inset 0 -2px 0 rgba(120,50,0,.45)}
.tb .in::before{display:none}
.slot{background:var(--sheen),var(--brush),linear-gradient(180deg,#3a74e0 0%,#2358c2 40%,#1c4aa6 60%,#2356b8 100%)!important;box-shadow:inset 0 3px 0 rgba(190,220,255,.45),inset 0 -3px 0 rgba(0,10,40,.5),inset 2px 0 0 rgba(190,220,255,.12),inset -2px 0 0 rgba(0,10,40,.3)}
.slot::before{display:none}
.slot::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--rivet) 8px 8px/8px 8px no-repeat,var(--rivet) 8px calc(100% - 8px)/8px 8px no-repeat}
.deploy .face{background:var(--sheen),var(--brush),linear-gradient(180deg,#5fe083 0%,#3cc463 40%,#2fab52 60%,#38bb5c 100%)!important;box-shadow:inset 0 3px 0 rgba(225,255,230,.55),inset 0 -4px 0 rgba(0,40,15,.45)}
.deploy .face::before{display:none}
.deploy .go2{background:linear-gradient(180deg,#1c232d,#05080c);box-shadow:inset 0 2px 0 rgba(200,220,245,.18)}
.readout{background:var(--brush),linear-gradient(180deg,rgba(26,33,43,.9),rgba(8,11,16,.9))!important}
.readout .plus{background:linear-gradient(180deg,#63dd84,#35b85a 55%,#2a9d4b)!important;box-shadow:inset 0 0 0 3px #05080c,inset 0 5px 0 rgba(220,255,230,.35)}
.tasksBtn .cnt{background:linear-gradient(180deg,#ffd06a,#f5a020 55%,#e08a10)}
.lv .n b{background:linear-gradient(180deg,#ffe29a,#ffae2b 55%,#d97e00);-webkit-background-clip:text;background-clip:text;color:transparent}

.xpbar{height:30px!important;border-width:3px!important}
.xpbar::after{opacity:.28}
.xpbar i{background:linear-gradient(180deg,#8fe0ff,#3cb8f0 50%,#1b8cc8)!important}
.xpbar span{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font:800 16px var(--f-head);color:#fff;letter-spacing:.05em;
  text-shadow:0 1px 0 #05080c,1px 0 0 #05080c,-1px 0 0 #05080c,0 -1px 0 #05080c,0 2px 3px rgba(0,0,0,.7)}

/* ---- nav: separate console plates like the original (steel rim, rounded, tilted back) ---- */

/* ---------------- environment painting ---------------- */
function paint(){
const cv=document.getElementById('bg'), g=cv.getContext('2d'); g.setTransform(2,0,0,2,0,0);
g.fillStyle='#070a10'; g.fillRect(0,0,1600,900);
const img=new Image(); img.onload=()=>{
  // the game's own hangar (mcBgDark from bmmClientCC.swf), scaled to cover the stage
  // fit to width so the whole room shows (crane, machinery, barrels, crates); lift it a little
  const k=1600/img.width, w=1600, h=img.height*k;
  g.save(); g.filter='brightness(1.25) saturate(1.1)'; g.drawImage(img,0,0,w,h); g.restore();
  // below the room: floor that continues its colour
  const fl0=g.createLinearGradient(0,h-40,0,900); fl0.addColorStop(0,'#070b12'); fl0.addColorStop(1,'#020305'); g.fillStyle=fl0; g.fillRect(0,h-2,1600,900-h+2);
  // the game's own dock frame (hazard posts either side, dark dock plate at the bottom)
  if(frame.complete&&frame.naturalWidth){ const fk=1600/frame.naturalWidth, fh=frame.naturalHeight*fk; g.drawImage(frame,0,900-fh,1600,fh); }
  { const d=g.createLinearGradient(0,700,0,900); d.addColorStop(0,'rgba(0,0,0,0)'); d.addColorStop(.35,'rgba(0,0,0,.45)'); d.addColorStop(1,'rgba(0,0,0,.7)'); g.fillStyle=d; g.fillRect(0,700,1600,200); }
  // spotlight on the centre bay and a warm pool under the pedestal
  g.save(); g.globalCompositeOperation='lighter'; g.filter='blur(4px)';
  const cone=g.createLinearGradient(0,40,0,760); cone.addColorStop(0,'rgba(255,236,200,.22)'); cone.addColorStop(.7,'rgba(255,226,180,.06)'); cone.addColorStop(1,'rgba(255,220,170,0)');
  g.fillStyle=cone; g.beginPath(); g.moveTo(748,40); g.lineTo(852,40); g.lineTo(1070,760); g.lineTo(530,760); g.fill();
  g.filter='blur(26px)'; g.fillStyle='rgba(255,170,70,.28)'; g.beginPath(); g.ellipse(800,730,300,40,0,0,7); g.fill(); g.restore();
  // floor band so the pedestals have something to stand on
  
  const vg=g.createRadialGradient(800,430,380,800,430,1000); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.3)'); g.fillStyle=vg; g.fillRect(0,0,1600,900);
};
const frame=new Image(); frame.src='assets/hangar_frame.png'; frame.onload=()=>{ img.src='assets/hangar_dark.png'; };
}
Promise.all(['800 150px "Oxanium"','800 360px "Oxanium"','700 15px "Rajdhani"'].map(f=>document.fonts.load(f))).then(paint,paint);
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
/* ---------------- mechs ---------------- */
function place(id,key,h,left,top){const w=document.getElementById(id);const i=document.createElement('div');buildMech(i,key,h);w.appendChild(i);w.style.width=i.dataset.w+'px';w.style.height=i.dataset.h+'px';if(left!=null){w.style.left=left+'px';w.style.top=top+'px';}return w;}
// every mech stands with its feet centred on its pedestal (standOn uses the midpoint between the legs)
const PED={main:[800,716],left:[440,672],right:[1160,672]};
const H=610, m=window.MECHS.target, W=m.w*H/m.h, L=PED.main[0]-m.fx*H/m.h, T=PED.main[1]-m.fy*H/m.h;
place('mech','target',H,L,T); place('refl','target',H,L,716-6);
{ const sh=document.getElementById('shade'); sh.style.left=L+'px'; sh.style.top=T+'px'; sh.style.width=W+'px'; sh.style.height=H+'px';
  const src=[...document.querySelectorAll('#mech img')];
  /* a mech-shaped mask: stack the same parts, then paint a gradient through it */
  const holder=document.createElement('div'); buildMech(holder,'target',H); sh.appendChild(holder);
  holder.querySelectorAll('img').forEach(i=>{i.style.filter='brightness(0) invert(1)';});
  const grad=document.createElement('div'); grad.style.cssText='position:absolute;inset:0;mix-blend-mode:multiply;background:linear-gradient(180deg,rgba(255,236,210,1) 0%,rgba(150,175,215,1) 55%,rgba(70,90,130,1) 100%)'; sh.appendChild(grad); sh.style.isolation='isolate'; }
place('side1','m2',420); standOn(document.getElementById('side1'),'m2',420,...PED.left);
place('side2','m3',390); standOn(document.getElementById('side2'),'m3',390,...PED.right);


/* ---------------- dust in the light (animated) ---------------- */
const fx=document.getElementById('fx').getContext('2d'); const motes=[];
for(let i=0;i<0;i++) motes.push({x:520+rnd()*560,y:60+rnd()*680,r:.6+rnd()*1.6,s:.08+rnd()*.25,a:.15+rnd()*.5});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(){ fx.clearRect(0,0,1600,900); for(const p of motes){ if(!reduce){p.y-=p.s; p.x+=Math.sin(p.y/40)*.15; if(p.y<50){p.y=740;}}
  fx.fillStyle=`rgba(255,236,200,${p.a})`; fx.beginPath(); fx.arc(p.x,p.y,p.r,0,7); fx.fill(); } if(!reduce) requestAnimationFrame(frame); }
frame();

{ const st=document.querySelector('.stage'), b=document.getElementById('tasksBtn');
  const set=o=>{st.classList.toggle('tasks-open',o); b.classList.toggle('open',o);};
  b.onclick=()=>set(!st.classList.contains('tasks-open'));
  document.getElementById('closeTasks').onclick=()=>set(false);
  document.getElementById('veil').onclick=()=>set(false);
  const fromHash=()=>set(location.hash==='#tasks'); addEventListener('hashchange',fromHash); fromHash(); }
