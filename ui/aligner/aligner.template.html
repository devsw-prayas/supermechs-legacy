<title>Mech Aligner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: blank stage on the left, one card per item on the right; stacks under 900px.
   Palette: cool grey ground, ink text, caution-orange for the selected item. */
:root{
  --bg:#e9edf1; --panel:#ffffff; --panel2:#f4f6f8; --ink:#10151c; --mute:#5b6773; --line:#cdd5dd;
  --accent:#ff5a1f; --accent-ink:#ffffff; --stage:#f7f8fa; --ok:#178a4a; --warn:#b26a00;
  --f-head:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --panel:#161b22; --panel2:#1c222a; --ink:#e8edf2; --mute:#95a1ad; --line:#2b3440;
  --accent:#ff7a45; --accent-ink:#1a0d06; --stage:#0b0e12; --ok:#4fd18a; --warn:#f0b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --panel:#161b22; --panel2:#1c222a; --ink:#e8edf2; --mute:#95a1ad; --line:#2b3440;
  --accent:#ff7a45; --accent-ink:#1a0d06; --stage:#0b0e12; --ok:#4fd18a; --warn:#f0b04a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font:700 22px/1 var(--f-head);letter-spacing:.06em;text-transform:uppercase;margin-right:8px}
label.f{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
select,input[type=number],button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
select{max-width:220px}
button{cursor:pointer;font-weight:500}
button:hover{border-color:var(--mute)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible,#view:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.spacer{flex:1}
#status{font:500 12px var(--f-mono);color:var(--mute);min-width:0}
#status.ok{color:var(--ok)} #status.warn{color:var(--warn)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);min-height:0;overflow:hidden}
.stagewrap{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#view{position:relative;overflow:hidden;background:var(--stage);touch-action:none;cursor:default;min-height:260px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world img.part{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
#world img.part.sel{filter:drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 1px var(--accent))}
.hint{position:absolute;left:12px;bottom:10px;font:500 11px var(--f-mono);color:var(--mute);background:color-mix(in srgb,var(--panel) 88%,transparent);padding:4px 8px;border-radius:6px;pointer-events:none;max-width:calc(100% - 24px)}
.side{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:10px 16px 20px;min-height:0}
.side h2{font:700 15px var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:8px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel2);cursor:pointer}
.card.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:var(--panel)}
.card .top{display:flex;align-items:center;gap:8px}
.card .nm{font:700 16px var(--f-head);letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0}
.card .nm small{font:500 11px var(--f-mono);color:var(--mute);letter-spacing:0;text-transform:none;margin-left:6px}
.card .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.card .row label{display:flex;flex-direction:column;gap:2px;font:500 10px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.card input[type=number]{width:100%;font-family:var(--f-mono);padding:4px 6px}
.card select{width:100%;max-width:none;margin-top:6px}
.card .abs{font:500 10px var(--f-mono);color:var(--mute);margin-top:5px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.card .mini{display:flex;gap:6px;margin-top:6px}
.card .mini button{padding:3px 8px;font-size:12px}
.card input[type=checkbox]{accent-color:var(--accent)}
details{margin-top:12px}
summary{cursor:pointer;font:600 12px var(--f-mono);color:var(--mute)}
textarea{width:100%;height:190px;font:12px/1.35 var(--f-mono);background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px}
.note{font-size:12px;color:var(--mute);margin:4px 0 10px}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;overflow:visible}
  .stagewrap{grid-template-rows:auto auto}
  #view{height:62vh}
  .side{border-left:0;border-top:1px solid var(--line);overflow:visible}
}
</style>

<div class="app">
  <header>
    <h1>Mech Aligner</h1>
    <label class="f">Torso <select id="torsoSel" aria-label="Torso sprite"></select></label>
    <span class="spacer"></span>
    <span id="status" role="status">loading…</span>
    <button id="saveBtn" class="pri" type="button">Save</button>
    <button id="copyBtn" type="button">Copy JSON</button>
  </header>
  <main>
    <section class="stagewrap">
      <div class="tools">
        <button id="zOut" type="button" aria-label="Zoom out">−</button>
        <button id="zIn" type="button" aria-label="Zoom in">+</button>
        <button id="zFit" type="button">Fit</button>
        <button id="resetAll" type="button">Reset all offsets</button>
      </div>
      <div id="view" tabindex="0" aria-label="Mech stage. Drag an item; arrow keys nudge the selected item.">
        <div id="world"></div>
        <div class="hint">Drag an item · arrows nudge 1 px (Shift 10, Alt 0.25) · wheel zooms · Space+drag pans</div>
      </div>
    </section>
    <aside class="side">
      <h2>Items</h2>
      <p class="note">Pixels of the 2× torso sprite, measured from the torso's top-left. dx and dy are added to where the game's anchors put each item.</p>
      <div id="cards"></div>
      <details><summary>Saved data (JSON)</summary><textarea id="json" readonly spellcheck="false"></textarea></details>
    </aside>
  </main>
</div>

<script>const MANIFEST = /*MANIFEST*/null;</script>
<script>
(function(){
'use strict';
const S = 2;
const SLOTS = [
  {id:'top1',label:'Top 1',note:'near',cat:'top',anchor:'mcTop1',z:7},
  {id:'top2',label:'Top 2',note:'far',cat:'top',anchor:'mcTop2',z:3},
  {id:'side1',label:'Side 1',note:'near, upper',cat:'side',anchor:'mcSide1',z:9},
  {id:'side2',label:'Side 2',note:'far, upper',cat:'side',anchor:'mcSide2',z:1},
  {id:'side3',label:'Side 3',note:'near, lower',cat:'side',anchor:'mcSide3',z:10},
  {id:'side4',label:'Side 4',note:'far, lower',cat:'side',anchor:'mcSide4',z:2},
  {id:'leg1',label:'Leg 1',note:'near',cat:'leg',anchor:'mcLeg1',z:8},
  {id:'leg2',label:'Leg 2',note:'far',cat:'leg',anchor:'mcLeg2',z:4}
];
const TORSO_Z = 6;
const DEFAULTS = {leg1:'leg73D_phys',leg2:'leg73D_phys',top1:'topLaser2B_phys',top2:'topLaser2C_phys',
  side1:'cannon3C',side2:'sideRifle1E',side3:'sideRifle2E',side4:'sideRifle1E'};
const $ = id => document.getElementById(id);
const items = {}; for(const c of ['torso','leg','top','side']){ items[c]={}; for(const it of MANIFEST[c]) items[c][it.f]=it; }
const st = { torso:'torso52_phys', slots:{}, sel:'top1', zoom:1, px:0, py:0, db:null };
const freshSlots = () => { const o={}; for(const sl of SLOTS) o[sl.id]={sprite:DEFAULTS[sl.id]||null,dx:0,dy:0,z:sl.z,vis:true}; return o; };
st.slots = freshSlots();
const imgs={}, cardEls={}, canv={};
const view=$('view'), world=$('world');
const tItem = () => items.torso[st.torso];
const spriteOf = sl => { const s=st.slots[sl.id]; return s&&s.sprite?items[sl.cat][s.sprite]||null:null; };

/* base position = where the game's anchor math puts the item, in torso-PNG pixels */
function base(sl){
  const t=tItem(), it=spriteOf(sl); const a=t.a[sl.anchor];
  const w=it?it.w:0, h=it?it.h:0;
  if(!a){ const c=t.a.mcCenter||[t.w/4,t.h/4]; return [c[0]*S-w/2,c[1]*S-h/2,false]; }
  const p=it&&it.a&&it.a.mcTorso; const pv=p||[w/S*0.2,h/S*0.6];
  return [a[0]*S-pv[0]*S, a[1]*S-pv[1]*S, !!p];
}
const pos = sl => { const b=base(sl), s=st.slots[sl.id]; return [b[0]+s.dx,b[1]+s.dy,b[2]]; };

function mkImg(id){ const i=new Image(); i.className='part'; i.draggable=false; world.appendChild(i); imgs[id]=i; return i; }
function layout(){
  const t=tItem();
  const ti=imgs.torso||mkImg('torso'); const tsrc='s/torso/'+t.f+'.png';
  if(ti.dataset.src!==tsrc){ ti.src=tsrc; ti.dataset.src=tsrc; delete canv.torso; }
  ti.style.left='0px'; ti.style.top='0px'; ti.style.width=t.w+'px'; ti.style.height=t.h+'px'; ti.style.zIndex=TORSO_Z;
  ti.classList.toggle('sel',st.sel==='torso');
  for(const sl of SLOTS){
    const s=st.slots[sl.id], it=spriteOf(sl), img=imgs[sl.id]||mkImg(sl.id);
    if(!it||!s.vis){ img.style.display='none'; continue; }
    const src='s/'+sl.cat+'/'+it.f+'.png'; if(img.dataset.src!==src){ img.src=src; img.dataset.src=src; delete canv[sl.id]; }
    const p=pos(sl);
    img.style.display='block'; img.style.left=p[0]+'px'; img.style.top=p[1]+'px'; img.style.zIndex=s.z; img.style.width=it.w+'px'; img.style.height=it.h+'px';
    img.classList.toggle('sel',st.sel===sl.id);
  }
  applyView();
}
function applyView(){ world.style.transform='translate('+st.px+'px,'+st.py+'px) scale('+st.zoom+')'; }
function fit(){
  const r=view.getBoundingClientRect(); const t=tItem(); let x0=0,y0=0,x1=t.w,y1=t.h;
  for(const sl of SLOTS){ const s=st.slots[sl.id], it=spriteOf(sl); if(!it||!s.vis) continue; const p=pos(sl); x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]+it.w);y1=Math.max(y1,p[1]+it.h); }
  const m=40; st.zoom=Math.max(.1,Math.min((r.width-2*m)/(x1-x0),(r.height-2*m)/(y1-y0)));
  st.px=(r.width-(x1-x0)*st.zoom)/2-x0*st.zoom; st.py=(r.height-(y1-y0)*st.zoom)/2-y0*st.zoom; applyView();
}

/* cards */
function optionsFor(cat,cur){ let h='<option value="">— none —</option>'; for(const it of MANIFEST[cat]) h+='<option value="'+it.f+'"'+(it.f===cur?' selected':'')+'>'+it.f+(it.a&&it.a.mcTorso?'':' (no anchor data)')+'</option>'; return h; }
function buildCards(){
  const box=$('cards'); box.innerHTML='';
  for(const sl of SLOTS){
    const s=st.slots[sl.id], c=document.createElement('div'); c.className='card'; c.tabIndex=0; c.dataset.id=sl.id;
    c.innerHTML='<div class="top"><span class="nm">'+sl.label+'<small>'+sl.note+'</small></span><label style="font-size:12px;color:var(--mute);display:flex;gap:4px;align-items:center"><input type="checkbox" class="vis"'+(s.vis?' checked':'')+'> show</label></div>'+
      '<select class="sp" aria-label="'+sl.label+' sprite">'+optionsFor(sl.cat,s.sprite)+'</select>'+
      '<div class="row"><label>dx<input type="number" class="dx" step="1" value="'+s.dx+'"></label><label>dy<input type="number" class="dy" step="1" value="'+s.dy+'"></label><label>layer<input type="number" class="z" step="1" value="'+s.z+'"></label></div>'+
      '<div class="abs"><span class="pos"></span><span class="anc"></span></div><div class="mini"><button type="button" class="rst">Reset offset</button></div>';
    box.appendChild(c); cardEls[sl.id]=c;
    c.addEventListener('click',e=>{ if(!/INPUT|SELECT|BUTTON|LABEL/.test(e.target.tagName)) select(sl.id); });
    c.addEventListener('focusin',()=>{ if(st.sel!==sl.id) select(sl.id); });
    const q=k=>c.querySelector(k);
    q('.vis').addEventListener('change',e=>{ s.vis=e.target.checked; changed(); });
    q('.sp').addEventListener('change',e=>{ s.sprite=e.target.value||null; s.dx=0; s.dy=0; changed(); });
    q('.dx').addEventListener('input',e=>{ s.dx=+e.target.value||0; changed(); });
    q('.dy').addEventListener('input',e=>{ s.dy=+e.target.value||0; changed(); });
    q('.z').addEventListener('input',e=>{ s.z=+e.target.value||0; changed(); });
    q('.rst').addEventListener('click',()=>{ s.dx=0; s.dy=0; changed(); });
  }
  syncCards();
}
const fmt=n=>(Math.round(n*4)/4).toString();
function syncCards(){
  for(const sl of SLOTS){
    const c=cardEls[sl.id]; if(!c) continue; const s=st.slots[sl.id];
    c.classList.toggle('on',st.sel===sl.id);
    const set=(k,v)=>{ const e=c.querySelector(k); if(e&&document.activeElement!==e) e.value=v; };
    set('.dx',s.dx); set('.dy',s.dy); set('.z',s.z); set('.sp',s.sprite||'');
    const p=pos(sl); c.querySelector('.pos').textContent='x '+fmt(p[0])+'  y '+fmt(p[1]);
    const a=c.querySelector('.anc'); a.textContent=p[2]?'anchor data ok':'guessed pivot'; a.style.color=p[2]?'var(--ok)':'var(--warn)';
  }
}
function select(id){ st.sel=id; syncCards(); layout(); }

/* changes + saving */
let timer=null;
function changed(){ layout(); syncCards(); setStatus('unsaved','warn'); $('json').value=JSON.stringify(payload(),null,1);
  try{ localStorage.setItem('mechAlign2:'+tItem().b,JSON.stringify(payload())); }catch(e){}
  clearTimeout(timer); timer=setTimeout(()=>save(false),1600); }
function setStatus(t,cls){ const e=$('status'); e.textContent=t; e.className=cls||''; }
function payload(){
  const t=tItem(); const out={v:2,units:'pixels of the 2x torso PNG. x,y = top-left of the item; origin = torso PNG top-left',torso:{file:t.f,base:t.b,w:t.w,h:t.h,anchors:t.a},items:{},savedAt:new Date().toISOString()};
  for(const sl of SLOTS){ const s=st.slots[sl.id], it=spriteOf(sl), p=pos(sl);
    out.items[sl.id]={sprite:s.sprite||null,spriteBase:it?it.b:null,spriteAnchor:it&&it.a?it.a.mcTorso||null:null,x:Math.round(p[0]*4)/4,y:Math.round(p[1]*4)/4,dx:s.dx,dy:s.dy,layer:s.z,visible:s.vis,w:it?it.w:0,h:it?it.h:0,anchorDataOk:p[2]}; }
  return out;
}
async function save(manual){
  clearTimeout(timer); const p=payload(); $('json').value=JSON.stringify(p,null,1);
  if(!st.db){ setStatus(manual?'no shared storage here: use Copy JSON':'kept in this browser only','warn'); return; }
  try{ await st.db.doc('mechAlign2/'+tItem().b).set(p); setStatus('saved '+new Date().toLocaleTimeString(),'ok'); }
  catch(e){ setStatus('save failed ('+(e&&e.code||'error')+'): use Copy JSON','warn'); }
}
function applyPayload(p){
  if(!p||!p.items) return;
  for(const sl of SLOTS){ const q=p.items[sl.id]; if(!q) continue; const s=st.slots[sl.id];
    s.sprite=(q.sprite&&items[sl.cat][q.sprite])?q.sprite:null; s.dx=+q.dx||0; s.dy=+q.dy||0; s.z=q.layer!=null?+q.layer:s.z; s.vis=q.visible!==false; }
}
async function loadState(){
  st.slots=freshSlots(); let p=null;
  if(st.db){ try{ const snap=await st.db.doc('mechAlign2/'+tItem().b).get(); if(snap.exists) p=typeof snap.data==='function'?snap.data():snap.data; }catch(e){} }
  if(!p){ try{ const raw=localStorage.getItem('mechAlign2:'+tItem().b); if(raw) p=JSON.parse(raw); }catch(e){} }
  if(p) applyPayload(p);
  buildCards(); layout(); fit(); $('json').value=JSON.stringify(payload(),null,1);
  setStatus(p?'loaded saved alignment':(st.db?'ready, saves are shared':'ready'),p?'ok':'');
}

/* view controls */
function zoomAt(f,cx,cy){ const nz=Math.min(8,Math.max(.1,st.zoom*f)); const wx=(cx-st.px)/st.zoom, wy=(cy-st.py)/st.zoom; st.zoom=nz; st.px=cx-wx*nz; st.py=cy-wy*nz; applyView(); }
$('zIn').onclick=()=>zoomAt(1.25,view.clientWidth/2,view.clientHeight/2);
$('zOut').onclick=()=>zoomAt(.8,view.clientWidth/2,view.clientHeight/2);
$('zFit').onclick=fit;
$('resetAll').onclick=()=>{ for(const sl of SLOTS){ st.slots[sl.id].dx=0; st.slots[sl.id].dy=0; } changed(); };
view.addEventListener('wheel',e=>{ e.preventDefault(); const r=view.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top); },{passive:false});

/* picking + dragging */
function ensureCanvas(id,img){ let c=canv[id]; if(!c||c.src!==img.src){ const cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight; const g=cv.getContext('2d',{willReadFrequently:true}); g.drawImage(img,0,0); c={g,src:img.src}; canv[id]=c; } return c; }
function solid(id,lx,ly,w,h){ if(lx<0||ly<0||lx>=w||ly>=h) return false; const img=imgs[id]; if(!img||!img.complete||!img.naturalWidth) return true; try{ return ensureCanvas(id,img).g.getImageData(Math.floor(lx),Math.floor(ly),1,1).data[3]>24; }catch(e){ return true; } }
function pick(wx,wy){
  const cand=[];
  for(const sl of SLOTS){ const s=st.slots[sl.id], it=spriteOf(sl); if(!it||!s.vis) continue; const p=pos(sl); if(solid(sl.id,wx-p[0],wy-p[1],it.w,it.h)) cand.push({id:sl.id,z:s.z}); }
  if(solid('torso',wx,wy,tItem().w,tItem().h)) cand.push({id:'torso',z:TORSO_Z});
  cand.sort((a,b)=>b.z-a.z); if(!cand.length) return null;
  const cur=cand.find(c=>c.id===st.sel&&c.id!=='torso'); return (cur||cand.find(c=>c.id!=='torso')||cand[0]).id;
}
let drag=null, space=false;
const toWorld=e=>{ const r=view.getBoundingClientRect(); return [(e.clientX-r.left-st.px)/st.zoom,(e.clientY-r.top-st.py)/st.zoom]; };
view.addEventListener('pointerdown',e=>{
  view.focus({preventScroll:true}); view.setPointerCapture(e.pointerId);
  if(e.button===1||e.button===2||space){ drag={type:'pan',x:e.clientX,y:e.clientY,px:st.px,py:st.py}; e.preventDefault(); return; }
  const [wx,wy]=toWorld(e); const id=pick(wx,wy);
  if(!id||id==='torso'){ drag={type:'pan',x:e.clientX,y:e.clientY,px:st.px,py:st.py}; return; }
  select(id); const s=st.slots[id]; drag={type:'part',id,x:e.clientX,y:e.clientY,dx:s.dx,dy:s.dy};
});
view.addEventListener('pointermove',e=>{
  if(!drag) return; const ddx=e.clientX-drag.x, ddy=e.clientY-drag.y;
  if(drag.type==='pan'){ st.px=drag.px+ddx; st.py=drag.py+ddy; applyView(); }
  else{ const s=st.slots[drag.id]; s.dx=Math.round((drag.dx+ddx/st.zoom)*4)/4; s.dy=Math.round((drag.dy+ddy/st.zoom)*4)/4; changed(); }
});
const endDrag=()=>{ drag=null; };
view.addEventListener('pointerup',endDrag); view.addEventListener('pointercancel',endDrag);
view.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;
  if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(tag)){ space=true; e.preventDefault(); }
  if(/INPUT|SELECT|TEXTAREA/.test(tag)) return;
  const step=e.shiftKey?10:(e.altKey?.25:1); let mx=0,my=0;
  if(e.key==='ArrowLeft')mx=-step; else if(e.key==='ArrowRight')mx=step; else if(e.key==='ArrowUp')my=-step; else if(e.key==='ArrowDown')my=step; else return;
  e.preventDefault(); const s=st.slots[st.sel]; if(!s) return; s.dx+=mx; s.dy+=my; changed();
});
addEventListener('keyup',e=>{ if(e.code==='Space') space=false; });

/* boot */
$('torsoSel').innerHTML=MANIFEST.torso.map(it=>'<option value="'+it.f+'">'+it.f+'</option>').join('');
$('torsoSel').value=st.torso;
$('torsoSel').addEventListener('change',e=>{ st.torso=e.target.value; loadState(); });
$('saveBtn').addEventListener('click',()=>save(true));
$('copyBtn').addEventListener('click',async()=>{ const txt=JSON.stringify(payload(),null,1); $('json').value=txt; document.querySelector('details').open=true;
  try{ await navigator.clipboard.writeText(txt); setStatus('JSON copied','ok'); }catch(e){ $('json').focus(); $('json').select(); setStatus('select the JSON below and copy it','warn'); } });
loadState();
